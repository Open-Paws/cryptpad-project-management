name: Desloppify Quality Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality Gate (score >= 70)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache desloppify install
        id: cache-desloppify
        uses: actions/cache@v5
        with:
          path: /tmp/desloppify
          key: desloppify-${{ runner.os }}-${{ hashFiles('.github/workflows/desloppify.yml') }}

      - name: Clone desloppify
        if: steps.cache-desloppify.outputs.cache-hit != 'true'
        run: |
          git clone --no-recurse-submodules https://github.com/Open-Paws/desloppify.git /tmp/desloppify

      - name: Install desloppify
        run: |
          # Pin tree-sitter-language-pack to <1.8 — the 1.8.0 release (after
          # 2026-05-02) changed the type of objects it returns, producing
          # `TypeError: __new__() argument 1 must be tree_sitter.Language,
          # not builtins.Language` inside desloppify's tree-sitter analysis.
          # This broke the quality gate on every PR opened after the
          # language-pack 1.8.0 release, including dependabot PRs #115-#119.
          # Drop the constraint once desloppify (or language-pack) ships a
          # compatible fix and this workflow has been verified against it.
          pip install "tree-sitter-language-pack<1.8"
          pip install "/tmp/desloppify[full]"

      - name: Run quality gate
        run: |
          set +e
          SCAN_OUTPUT=$(desloppify scan --path . --profile ci --no-badge 2>&1)
          SCAN_RC=$?
          set -e
          echo "${SCAN_OUTPUT}"
          if [ "${SCAN_RC}" -ne 0 ]; then
            echo "ERROR: desloppify scan exited with code ${SCAN_RC}"
            exit 1
          fi
          SCORE=$(echo "${SCAN_OUTPUT}" | grep -oP 'objective \K[\d.]+(?=/100)')
          if [ -z "${SCORE}" ]; then
            echo "ERROR: could not extract objective score from desloppify output"
            exit 1
          fi
          echo "Objective score: ${SCORE}/100"
          python3 -c "
          score = float('${SCORE}')
          threshold = 70
          if score < threshold:
              print(f'FAIL: objective score {score} is below the minimum {threshold}')
              raise SystemExit(1)
          print(f'PASS: objective score {score} >= {threshold}')
          "
          echo "## Desloppify Quality Gate" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| | |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|---|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Objective score | **${SCORE}/100** |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Threshold | 70 |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Scan path | \`.\` |" >> "${GITHUB_STEP_SUMMARY}"
          python3 -c "
          score = float('${SCORE}')
          result = 'PASS' if score >= 70 else 'FAIL'
          print(f'| Result | **{result}** |')
          " >> "${GITHUB_STEP_SUMMARY}"
